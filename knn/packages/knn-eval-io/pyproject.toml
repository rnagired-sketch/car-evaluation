[project]
name = "knn-eval-io"
version = "0.1.0"
description = "Application layer for the k-NN model: YAML settings with cattrs, reports, plots and the knn-eval CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "knn-eval-core",
    "cattrs>=24.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.scripts]
knn-eval = "knn_eval_io.__main__:main"

[tool.uv.sources]
knn-eval-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knn_eval_io"]
