# The one configuration file for the project: what a run does.
# Where the data comes from and where results go are command-line options, not settings here:
#
#   uv run car-eval run         --config configs/config.yaml --data data/car.data --output outputs
#   uv run car-eval explain     --config configs/config.yaml --output outputs
#   uv run car-eval show-config --config configs/config.yaml   # print the resolved settings
#
# The base settings below are the full evaluation plan from the proposal. To run a variant,
# set `profile` to one of the names under `profiles` (at the bottom of the file). A profile
# lists only what it changes: nested sections merge key by key, and lists/values replace.

profile: default            # default | quick | colab

figures:
  save: true                # write PNGs to <output>/figures
  show: false               # display inline (notebooks)

logging:                    # progress and errors, on the terminal (standard error)
  level: info               # debug | info | warning | error
  save: true                # also append them to <output>/car-eval.log

pipeline:
  seed: 42
  fractions:                # proposal Evaluation Plan: 50 / 20 / 30
    train: 0.5
    validation: 0.2
    test: 0.3
  grid:                     # CART tree-building search (null depth = unlimited)
    criterion: [gini, entropy]
    max_depth: [6, 8, 10, 12, null]
    min_samples_split: [2, 5]
    min_samples_leaf: [1, 2, 4]
    class_weight: [null, balanced]
  cv:                       # repeated stratified k-fold on the training split
    n_splits: 5
    n_repeats: 3
  adequacy:                 # below either target, the proposal falls back to k-NN
    min_macro_f1: 0.90
    max_false_acceptance: 0.05
  feature_sets: [raw, with_concepts]   # each is tuned; the validation split picks one
  compare_benchmarks: true             # majority baseline, rev0 recipe, k-NN
  stability_seeds: 20                  # re-split this many times; 0 skips the study
  permutation_repeats: 20

# Cars to rate and explain (doors: 2 | 3 | 4 | 5more, persons: 2 | 4 | more).
cars:
  - {buying: low,   maint: low,   doors: 4,     persons: 4,    lug_boot: big,   safety: high}  # cheap, roomy, safe
  - {buying: vhigh, maint: vhigh, doors: 4,     persons: more, lug_boot: big,   safety: high}  # safe but very expensive
  - {buying: low,   maint: low,   doors: 4,     persons: 2,    lug_boot: big,   safety: high}  # only two seats
  - {buying: med,   maint: med,   doors: 2,     persons: 4,    lug_boot: small, safety: med}   # average, small boot
  - {buying: low,   maint: med,   doors: 5more, persons: more, lug_boot: med,   safety: low}   # unsafe

profiles:
  # `default` needs no entry: it is the base settings above, unchanged.

  quick:                    # fast smoke run, well under a minute
    figures:
      save: false
    pipeline:
      grid:
        criterion: [entropy]
        max_depth: [10, null]
        min_samples_split: [2]
        min_samples_leaf: [1]
        class_weight: [null]
      cv:
        n_repeats: 1
      stability_seeds: 3
      permutation_repeats: 5

  colab:                    # Google Colab notebook: figures shown inline as well as saved
    figures:
      show: true
