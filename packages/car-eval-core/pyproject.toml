[project]
name = "car-eval-core"
version = "0.1.0"
description = "Backend logic: validation, splitting, CART tuning and pruning, evaluation and explanation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/car_eval_core"]
