[project]
name = "car-eval-io"
version = "0.1.0"
description = "Input/output: data sources, YAML settings and object construction with cattrs, reports, plots and the CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "car-eval-core",
    "cattrs>=24.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.scripts]
car-eval = "car_eval_io.__main__:main"

[tool.uv.sources]
car-eval-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/car_eval_io"]
